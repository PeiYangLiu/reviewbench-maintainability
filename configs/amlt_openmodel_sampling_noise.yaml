# Sampling-noise replicates: the same SFT adapter, served identically, three
# times. Generation is stochastic (no temperature or seed is pinned, so the
# deployment default applies), which means a single run of an arm carries an
# unmeasured variance that every delta in this line has been reported against.
#
# Serving matches amlt_openmodel_v2_base_ladder.yaml's Qwen3-8B rung, so the
# untuned base row measured in that run is a valid fourth reference point
# without re-running it.
#
# Every field matches amlt_openmodel_rl_three_arm.yaml's SFT arm exactly,
# including MAX_OUTPUT_TOKENS, because the discordance between these three runs
# is the noise floor that the arm-vs-arm comparison is read against. On the
# 402-task board the three arms disagreed on 40-46 tasks with no direction
# winning (McNemar p = 0.46-0.88), and without this baseline there is no way to
# say whether that is an arm effect or just resampling.
description: "ReviewBench sampling-noise replicates - the same SFT arm run three times"

target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
    - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"

code:
  local_dir: $CONFIG_DIR/..

data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal

jobs:
  - name: noise-rep1
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-8B
        MODEL_REVISION: b968826d9c46dd6066d109eabc6255188de91218
        LORA_ADAPTER: rl-sft-qwen3-8b=rl-adapters/qwen3-8b
        MAX_LORA_RANK: "32"
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_TOOL_RESULT_CHARS: "24000"
        MAX_OUTPUT_TOKENS: "8192"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  - name: noise-rep2
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-8B
        MODEL_REVISION: b968826d9c46dd6066d109eabc6255188de91218
        LORA_ADAPTER: rl-sft-qwen3-8b=rl-adapters/qwen3-8b
        MAX_LORA_RANK: "32"
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_TOOL_RESULT_CHARS: "24000"
        MAX_OUTPUT_TOKENS: "8192"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  - name: noise-rep3
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-8B
        MODEL_REVISION: b968826d9c46dd6066d109eabc6255188de91218
        LORA_ADAPTER: rl-sft-qwen3-8b=rl-adapters/qwen3-8b
        MAX_LORA_RANK: "32"
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_TOOL_RESULT_CHARS: "24000"
        MAX_OUTPUT_TOKENS: "8192"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
