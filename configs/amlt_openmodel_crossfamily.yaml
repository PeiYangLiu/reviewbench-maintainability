# Generated with `amlt template -f ... -n 2 -y` under amlt 10.14.0.
description: ReviewBench 414-hard latest cross-family generation

target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
    - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"

code:
  local_dir: $CONFIG_DIR/..

data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal

jobs:
  - name: devstral2-123b-fp8
    identity: managed
    sku: 40G8-A100-IB-NvLink
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: mistralai/Devstral-2-123B-Instruct-2512
        MODEL_REVISION: 1613bf01adb5e1c6fdc196b46e6b173eae75eb4a
        TENSOR_PARALLEL_SIZE: "8"
        MAX_MODEL_LEN: "65536"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  - name: gpt-oss-120b
    identity: managed
    sku: 40G4-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: openai/gpt-oss-120b
        MODEL_REVISION: b5c939de8f754692c1647ca79fbf85e8c1e70f8a
        TENSOR_PARALLEL_SIZE: "4"
        MAX_MODEL_LEN: "65536"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  - name: minimax-m21-fp8
    identity: managed
    sku: 40G8-A100-IB-NvLink
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: MiniMaxAI/MiniMax-M2.1
        MODEL_REVISION: cd97f59135f37b2a6bf09356e485d5e4aeb7dc9c
        TENSOR_PARALLEL_SIZE: "8"
        MAX_MODEL_LEN: "65536"
        GENERATION_WORKERS: "8"
        MAX_NUM_SEQS: "8"
        TRUST_REMOTE_CODE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
