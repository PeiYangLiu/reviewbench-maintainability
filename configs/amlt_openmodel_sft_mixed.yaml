# Adapters retrained on the 33k mixed dataset, after the truncation defect in
# PITFALLS.md P69 invalidated the earlier run. Each adapter is served exactly as
# its own Qwen3 rung in configs/amlt_openmodel_qwen_ladder.yaml, over the same
# task shards, so the rung provides the matched baseline and the only difference
# between them is the fine-tuning.
description: ReviewBench Qwen3 mixed-dataset SFT adapters
target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC
environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
  - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"
code:
  local_dir: $CONFIG_DIR/..
data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal
jobs:
- name: qwen3-4b-sftmix-shard-0
  identity: managed
  sku: 40G2-A100
  process_count_per_node: 1
  sla_tier: standard
  command:
  - bash scripts/run_open_model_job.sh
  submit_args:
    env:
      MODEL_ID: Qwen/Qwen3-4B
      MODEL_REVISION: 1cfa9a7208912126459214e8b04321603b3df60c
      GENERATION_IDS_FILE: configs/openmodel_scope_ids/ladder-402/shard-0.ids
      TENSOR_PARALLEL_SIZE: '2'
      MAX_MODEL_LEN: '40960'
      GENERATION_WORKERS: '10'
      MAX_NUM_SEQS: '10'
      DISABLE_CUSTOM_ALL_REDUCE: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      LORA_ADAPTER: qwen3-4b-sftmix=sft-adapters/mixed-qwen3-4b
      MAX_LORA_RANK: '32'
- name: qwen3-4b-sftmix-shard-1
  identity: managed
  sku: 40G2-A100
  process_count_per_node: 1
  sla_tier: standard
  command:
