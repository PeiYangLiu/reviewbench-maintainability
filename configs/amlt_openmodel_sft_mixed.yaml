      HF_HUB_ENABLE_HF_TRANSFER: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      LORA_ADAPTER: qwen3-4b-sftmix=sft-adapters/mixed-qwen3-4b
      MAX_LORA_RANK: '32'
- name: qwen3-8b-sftmix-shard-0
  identity: managed
