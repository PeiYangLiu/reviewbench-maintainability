# SFT adapters across the Qwen3 size ladder, each served exactly as its own
# base rung is served in configs/amlt_openmodel_qwen_ladder.yaml. The rung is
# the adapter's baseline, so any serving difference between them would be
# indistinguishable from the effect of fine-tuning.
#
# Each adapter is served under its own name rather than the base model's, so a
# request that reaches the base weights by mistake fails instead of quietly
# scoring the wrong model.
description: ReviewBench Qwen3 SFT adapter ladder generation
target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC
environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
  # vllm imports a video decoder at startup, and torchcodec's current build
  # links libnvrtc.so.13 while this image ships CUDA 12.6 -- the server dies
  # before loading any weights. Nothing here decodes video.
  - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"
  - python -m pip uninstall -y torchcodec || true
code:
  local_dir: $CONFIG_DIR/..
data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal
jobs:
- name: qwen3-4b-sft-shard-0
  identity: managed
  sku: 40G2-A100
  process_count_per_node: 1
  sla_tier: standard
  command:
  - bash scripts/run_open_model_job.sh
  submit_args:
    env:
      MODEL_ID: Qwen/Qwen3-4B
      MODEL_REVISION: 1cfa9a7208912126459214e8b04321603b3df60c
      GENERATION_IDS_FILE: configs/openmodel_scope_ids/ladder-402/shard-0.ids
      TENSOR_PARALLEL_SIZE: '2'
      MAX_MODEL_LEN: '40960'
      GENERATION_WORKERS: '10'
      MAX_NUM_SEQS: '10'
      DISABLE_CUSTOM_ALL_REDUCE: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      LORA_ADAPTER: qwen3-4b-sft=sft-adapters/qwen3-4b
      MAX_LORA_RANK: '32'
- name: qwen3-4b-sft-shard-1
  identity: managed
  sku: 40G2-A100
  process_count_per_node: 1
  sla_tier: standard
