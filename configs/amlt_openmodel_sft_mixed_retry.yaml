# Retry for the one mixed-SFT shard that never produced output. Its job spec is
# identical to the sibling shard that succeeded, and the scheduler recorded no
# diagnostic, so this resubmits under a fresh experiment name rather than
# reusing a job whose state may be stale.
description: ReviewBench mixed SFT 4B shard-0 retry
target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC
environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
  # vllm imports a video decoder at startup, and torchcodec's current build
  # links libnvrtc.so.13 while this image ships CUDA 12.6 -- the server dies
  # before loading any weights. Nothing here decodes video.
  - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"
  - python -m pip uninstall -y torchcodec || true
code:
  local_dir: $CONFIG_DIR/..
data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal
jobs:
- name: qwen3-4b-sftmix-shard-0
  identity: managed
  sku: 40G2-A100
  process_count_per_node: 1
  sla_tier: standard
  command:
  - bash scripts/run_open_model_job.sh
  submit_args:
    env:
      MODEL_ID: Qwen/Qwen3-4B
      MODEL_REVISION: 1cfa9a7208912126459214e8b04321603b3df60c
      GENERATION_IDS_FILE: configs/openmodel_scope_ids/ladder-402/shard-0.ids
      TENSOR_PARALLEL_SIZE: '2'
      MAX_MODEL_LEN: '40960'
      GENERATION_WORKERS: '10'
      MAX_NUM_SEQS: '10'
      DISABLE_CUSTOM_ALL_REDUCE: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      LORA_ADAPTER: qwen3-4b-sftmix=sft-adapters/mixed-qwen3-4b
      MAX_LORA_RANK: '32'
