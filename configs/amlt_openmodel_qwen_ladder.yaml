# Generated with `amlt template -f ... -n 2 -y` under amlt 10.14.0.
# Qwen3 dense size ladder on the audited 402-task scope. Runner settings match
# the frozen Qwen3.6-27B baseline, including the 120000-char transcript cap,
# so every model is shown the same prompt. Only max_model_len differs, because
# Qwen3 tops out at its native max_position_embeddings=40960 and vLLM rejects
# anything larger. A prompt that exceeds that window fails the round and is
# scored as a generation failure for the model, which is the honest reading:
# a 40K-context model genuinely cannot hold that task. Shrinking the transcript
# to fit would hide that limit behind a harness handicap instead.
description: ReviewBench 402-audited Qwen3 size-ladder generation

target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
    - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"

code:
  local_dir: $CONFIG_DIR/..

data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal

jobs:
  - name: qwen3-4b-shard-0
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-4B
        MODEL_REVISION: 1cfa9a7208912126459214e8b04321603b3df60c
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/ladder-402/shard-0.ids
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  - name: qwen3-4b-shard-1
    identity: managed
