# Regenerates every model-task pair whose rounds were rejected for exceeding the
# served context window, now that the harness trims the transcript to fit
# instead of resending an over-long prompt until the round budget runs out.
#
# Each job reuses its model's established serving configuration verbatim, so the
# regenerated rows stay interchangeable with the rows they replace. Only the
# task scope differs, plus the removal of the hand-set MAX_TRANSCRIPT_CHARS
# budgets, which existed solely to dodge the defect this now fixes.
#
# Kimi's scope also carries the 8 audited tasks that no Kimi wave ever
# generated: its v14 remainder list had been computed from an assumed rather
# than a verified set of completed tasks.
description: ReviewBench context-fit regeneration
target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC
environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
  # vllm imports a video decoder at startup, and torchcodec's current build
  # links libnvrtc.so.13 while this image ships CUDA 12.6 -- the server dies
  # before loading any weights. Nothing here decodes video.
  - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"
  - python -m pip uninstall -y torchcodec || true
code:
  local_dir: $CONFIG_DIR/..
data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal
jobs:
- name: minimaxai-minimax-m21-context-fit
  identity: managed
  sku: 40G8-A100-IB-NvLink
  process_count_per_node: 1
  sla_tier: standard
  command:
  - bash scripts/run_open_model_job.sh
  submit_args:
    env:
      MODEL_ID: MiniMaxAI/MiniMax-M2.1
      MODEL_REVISION: cd97f59135f37b2a6bf09356e485d5e4aeb7dc9c
      TENSOR_PARALLEL_SIZE: '8'
      MAX_MODEL_LEN: '65536'
      GENERATION_WORKERS: '8'
      MAX_NUM_SEQS: '8'
      TRUST_REMOTE_CODE: '1'
      ENABLE_EXPERT_PARALLEL: '1'
      DISABLE_CUSTOM_ALL_REDUCE: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      GENERATION_IDS_FILE: configs/openmodel_scope_ids/context-fit/MiniMaxAI-MiniMax-M2.1.ids
- name: qwen-qwen3-4b-context-fit
