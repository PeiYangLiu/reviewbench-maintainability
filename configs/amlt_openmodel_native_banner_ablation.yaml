# Ablation: the same native multi-turn checkpoints served WITHOUT the round
# banner, to separate "the model learned when to stop" from "the model is being
# told how much budget is left".
#
# Under the trained format these two produce 375 and 379 of 402 with a median of
# 2 rounds, against 195 and 178 with a median of 32 for the per-round-split
# adapters they replace. That jump confounds five simultaneous changes; this run
# isolates one of them for the price of eval compute and no retraining.
#
# Serving deliberately mismatches training here: bare JSON tool results and a
# 32-round budget, which is what the previous adapter generation saw. If output
# collapses back toward 200 the stopping policy lives in the prompt; if it holds
# near 375 it has been internalised into the weights.
#
# The two base rungs are re-run here rather than cited from the earlier ladder:
# an upstream serving change between runs is exactly what P80 records, and a
# delta against a number measured days ago cannot be attributed to training.
#
# MAX_OUTPUT_TOKENS is 8192 against a 40960 window. That cost the mt-SFT
# adapters 8-11 tasks (P88) because they burn all 32 rounds and sit against the
# window; if native multi-turn really teaches the model to stop, the cost goes
# away on its own. It is held identical across all four jobs either way.
description: "Ablation - native multi-turn checkpoints served without the round banner"

target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
    # vllm imports a video decoder at startup, and torchcodec's current build
    # links libnvrtc.so.13 while this image ships CUDA 12.6 -- the server dies
    # before loading any weights. The dependency is unused here (no video), so
    # it is removed rather than pinned to a matching CUDA.
    - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"
    - python -m pip uninstall -y torchcodec || true

code:
  local_dir: $CONFIG_DIR/..

data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal

jobs:
  - name: nobanner-native-qwen3-8b
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: "/mnt/output/projects/reviewbench-sft/resumable/native-8b-clean-ctx24576/final"
        MODEL_REVISION: ""
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_ROUNDS: "32"
        MAX_TOOL_RESULT_CHARS: "24000"
        MAX_OUTPUT_TOKENS: "8192"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  - name: nobanner-native-qwen3-14b
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: "/mnt/output/projects/reviewbench-sft/resumable/full-Qwen-Qwen3-14B-mt_native_v6-ctx24576-ddafa40072d4c/final"
        MODEL_REVISION: ""
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_ROUNDS: "32"
        MAX_TOOL_RESULT_CHARS: "24000"
        MAX_OUTPUT_TOKENS: "8192"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
