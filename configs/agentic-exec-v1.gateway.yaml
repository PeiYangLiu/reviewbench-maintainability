# Same 402-task protocol; explicit model arms served by the local llm-gateway.
# Model IDs/accepted response identities are frozen, not silently substituted.
protocol: reviewbench-agentic-exec/v1
root: ..
tasks: data/releases/hard/20260808/tasks.jsonl
scope_ids: configs/openmodel_scope_ids/audited-402.ids
oracles: data/releases/hard/20260808/oracles.jsonl
repo_cache: ${REVIEWBENCH_REPO_CACHE}
asset_root: ${REVIEWBENCH_AGENTIC_ASSETS}
runtime_recipes: ${REVIEWBENCH_AGENTIC_RECIPES}
out_dir: .benchmarks/agentic-exec-v1-gateway
execution:
  workers: 4
agent:
  step_limit: 100
  wall_time_limit_seconds: 3600
  cost_limit: 0
  max_consecutive_format_errors: 3
budget:
  total_output_tokens: 128000
  per_call_output_tokens: 8192
observation:
  max_chars: 10000
models:
  gpt-6-astra:
    protocol: responses
    model_name: openai/gpt-6-astra
    api_base: http://127.0.0.1:4000/v1
    expected_response_models: [gpt-6-astra]
    model_kwargs:
      include: [reasoning.encrypted_content]
      reasoning: {effort: medium}
    request_timeout_seconds: 180
    transport_retries: 2
judge:
  # User instruction: first run the entire chain with Astra only; no fallback judge.
  score_version: reviewbench-judge-panel/astra-only-20261011-v1
  protocol: responses
  endpoint: http://127.0.0.1:4000/v1/responses
  models: [gpt-6-astra]
  expected_response_models:
    gpt-6-astra: [gpt-6-astra]
  max_context_chars: 300000
  max_output_tokens: 4096
  timeout_seconds: 180
