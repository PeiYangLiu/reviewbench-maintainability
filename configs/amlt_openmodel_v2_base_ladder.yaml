# Base Qwen3 rungs under v2, the control the SFT adapters need.
#
# The adapters run under agentic-line-edit/v2 while the ladder's base rows were
# produced under v1 several weeks earlier. Comparing those two directly would
# change the protocol and the serving window at the same time -- exactly the
# mistake recorded as P80, where an upstream default change was almost booked as
# a protocol effect. These rows re-measure the untuned bases under the adapters'
# own protocol, in the same period, so "SFT helped/hurt" becomes a one-variable
# statement.
#
# Serving is identical to amlt_openmodel_qwen_ladder.yaml (sku, TP, revision,
# MAX_MODEL_LEN=40960) and to amlt_openmodel_mt_sft.yaml, so each base row is
# interchangeable with its adapter row apart from the adapter itself.
description: ReviewBench 402-audited Qwen3 base ladder under agentic-line-edit/v2

target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
    - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"

code:
  local_dir: $CONFIG_DIR/..

data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal

jobs:
  - name: v2-base-qwen3-4b
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-4B
        MODEL_REVISION: 1cfa9a7208912126459214e8b04321603b3df60c
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_TOOL_RESULT_CHARS: "24000"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  - name: v2-base-qwen3-8b
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-8B
        MODEL_REVISION: b968826d9c46dd6066d109eabc6255188de91218
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_TOOL_RESULT_CHARS: "24000"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  - name: v2-base-qwen3-14b
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-14B
        MODEL_REVISION: 40c069824f4251a91eefaf281ebe4c544efd3e18
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_TOOL_RESULT_CHARS: "24000"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  - name: v2-base-qwen3-32b
    identity: managed
    sku: 40G4-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-32B
        MODEL_REVISION: 9216db5781bf21249d130ec9da846c4624c16137
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_TOOL_RESULT_CHARS: "24000"
        TENSOR_PARALLEL_SIZE: "4"
        MAX_MODEL_LEN: "40960"
