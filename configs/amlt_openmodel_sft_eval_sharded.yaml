# Generated with `amlt template -f ... -n 2 -y` under amlt 10.14.0.
# Evaluates the reviewbench-sft LoRA adapters on the audited 402-task scope.
# Base model, revision, SKU, TP size, context and worker counts are identical
# to the frozen Qwen3.6-27B baseline in amlt_openmodel_generation.yaml so the
# only intended difference is the attached adapter.
description: ReviewBench 402-audited Qwen3.6-27B SFT adapter generation (4 shards per adapter)

target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
    # vllm imports a video decoder at startup, and torchcodec's current build
    # links libnvrtc.so.13 while this image ships CUDA 12.6 -- the server dies
    # before loading any weights. The dependency is unused here (no video), so
    # it is removed rather than pinned to a matching CUDA.
    - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"
    - python -m pip uninstall -y torchcodec || true

code:
  local_dir: $CONFIG_DIR/..

data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal

jobs:
  - name: qwen36-27b-sft-stage1-full-shard-0
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3.6-27B
        MODEL_REVISION: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
        LORA_ADAPTER: qwen36-27b-sft-stage1-full=sft-adapters/stage1-full
        MAX_LORA_RANK: "32"
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/shards-402/shard-0.ids
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "65536"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  - name: qwen36-27b-sft-stage1-full-shard-1
