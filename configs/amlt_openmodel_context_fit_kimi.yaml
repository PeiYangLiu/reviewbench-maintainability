# Second pass for the Kimi tasks the first context-fit run left unresolved: one
# task exhausted the trim attempts because the trim was anchored to the nominal
# budget rather than the rendered transcript, and three never ran before the job
# ended. Serving configuration is unchanged from the Kimi board run.
description: ReviewBench context-fit regeneration (Kimi remainder)
target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC
environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
  # vllm imports a video decoder at startup, and torchcodec's current build
  # links libnvrtc.so.13 while this image ships CUDA 12.6 -- the server dies
  # before loading any weights. Nothing here decodes video.
  - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"
  - python -m pip uninstall -y torchcodec || true
code:
  local_dir: $CONFIG_DIR/..
data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal
jobs:
- name: moonshotai-kimi-k25-context-fit
  identity: managed
  sku: 80G8-H100-IB-NvLink
  process_count_per_node: 1
  sla_tier: standard
  command:
  - bash scripts/run_open_model_job.sh
  submit_args:
    env:
      MODEL_ID: moonshotai/Kimi-K2.5
      MODEL_REVISION: 4d01dfe0332d63057c186e0b262165819efb6611
      TENSOR_PARALLEL_SIZE: '8'
      MAX_MODEL_LEN: '32768'
      GENERATION_WORKERS: '2'
      MAX_NUM_SEQS: '2'
      GPU_MEMORY_UTILIZATION: '0.90'
      KV_CACHE_MEMORY_BYTES: 1200M
      KV_CACHE_DTYPE: fp8
      TRUST_REMOTE_CODE: '1'
      LANGUAGE_MODEL_ONLY: '1'
      ENFORCE_EAGER: '1'
      DISABLE_FLASHINFER_AUTOTUNE: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      GENERATION_IDS_FILE: configs/openmodel_scope_ids/context-fit/moonshotai-Kimi-K2.5.ids
