# Multi-turn SFT adapters evaluated under the protocol they were trained on.
#
# The first two SFT rounds were lost to train/inference mismatch, so the two
# settings that caused it are pinned explicitly here:
#
#   1. PROTOCOL=agentic-line-edit/v2 -- these adapters were trained on
#      alternating assistant/user conversations. Serving them under v1's
#      flattened TOOL TRANSCRIPT would reproduce exactly the mismatch this
#      round exists to remove.
#   2. MODEL_REVISION -- PEFT does not record the base revision in
#      adapter_config.json, so a wrong base loads silently and only shows up as
#      bad numbers. Every revision below is copied from the adapter's own
#      TRAIN_META.json and verified to match the rung it is compared against.
#
# Base rungs are served exactly as amlt_openmodel_qwen_ladder.yaml serves them
# (same sku, TP, MAX_MODEL_LEN=40960), so each adapter is comparable to its own
# base rung. Qwen3.6-27B follows amlt_openmodel_generation.yaml, which is its
# board configuration.
#
# MAX_MODEL_LEN stays at the ladder's 40960 even for the adapters trained at
# 16384: shrinking the served window for some rows only would mix a context
# effect into a training effect. The training-side truncation share is recorded
# in the delivery note (1.0% at 24576, 10.0% at 16384) and belongs in the
# writeup, not in the serving config.
description: ReviewBench 402-audited multi-turn SFT adapter evaluation (v2 protocol)

target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: Workspace_NLC

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  image_setup:
    # vllm imports a video decoder at startup, and torchcodec's current build
    # links libnvrtc.so.13 while this image ships CUDA 12.6 -- the server dies
    # before loading any weights. The dependency is unused here (no video), so
    # it is removed rather than pinned to a matching CUDA.
    - python -m pip install "vllm==0.26.0" "hf_transfer==0.1.9" "numpy==2.2.6" "scipy==1.15.3"
    - python -m pip uninstall -y torchcodec || true

code:
  local_dir: $CONFIG_DIR/..

data:
  local_dir: $REVIEWBENCH_OPENMODEL_REPO_CACHE
  remote_dir: reviewbench-openmodels/repo-cache-minimal

jobs:
  - name: mt-sft-qwen3-14b
    identity: managed
    sku: 40G2-A100
    process_count_per_node: 1
    sla_tier: standard
    command:
      - bash scripts/run_open_model_job.sh
    submit_args:
      env:
        MODEL_ID: Qwen/Qwen3-14B
        MODEL_REVISION: 40c069824f4251a91eefaf281ebe4c544efd3e18
        LORA_ADAPTER: qwen3-14b-mtsft=sft-adapters-mt/qwen3-14b
        MAX_LORA_RANK: "32"
        GENERATION_IDS_FILE: configs/openmodel_scope_ids/audited-402.ids
        PROTOCOL: agentic-line-edit/v2
        MAX_TOOL_RESULT_CHARS: "24000"
        TENSOR_PARALLEL_SIZE: "2"
        MAX_MODEL_LEN: "40960"
        GENERATION_WORKERS: "10"
        MAX_NUM_SEQS: "10"
        DISABLE_CUSTOM_ALL_REDUCE: "1"
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

