[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewbench-maintainability"
version = "0.1.0"
description = "Build and evaluate maintainability tasks from real code review signals."
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
agentic = ["mini-swe-agent==2.4.6", "tomli-w==1.2.0", "PyYAML>=6,<7"]
dev = ["pytest>=8,<10", "PyYAML>=6,<7", "build>=1,<2"]

[project.scripts]
reviewbench-agent = "reviewbench_maintainability.agentic.cli:main"
reviewbench-build = "reviewbench_maintainability.build_dataset:main"
reviewbench-curate = "reviewbench_maintainability.curate_pool:main"
reviewbench-evidence = "reviewbench_maintainability.evidence:main"
reviewbench-evaluate = "reviewbench_maintainability.evaluate:main"
reviewbench-merge = "reviewbench_maintainability.merge_candidates:main"
reviewbench-quality = "reviewbench_maintainability.quality_gate:main"
reviewbench-recovery = "reviewbench_maintainability.recovery:main"
reviewbench-release = "reviewbench_maintainability.release:main"
reviewbench-score = "reviewbench_maintainability.score_patch:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
